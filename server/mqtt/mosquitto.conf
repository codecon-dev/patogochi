# Mosquitto do patogochi
# Rede: cobranca-net (mesma dos outros containers). Porta 1883 local (plaintext)
# usada pelo PHP; porta 8883 TLS exposta na VM pra Core2/Alexa.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type notice
allow_anonymous false
password_file /mosquitto/config/passwd

# Listener interno (rede docker) — PHP publica por aqui
listener 1883
protocol mqtt

# Listener publico TLS — Core2 conecta por aqui
listener 8883
protocol mqtt
cafile /mosquitto/certs/chain.pem
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
require_certificate false
tls_version tlsv1.2

# Limites
max_packet_size 1048576
message_size_limit 1048576
