worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10M;
  client_body_timeout 60s;
  access_log /dev/stdout;

  types {
    application/yaml yaml yml;
  }

  server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Nao emitir redirects absolutos (nginx ta atras do Caddy na porta 8080)
    absolute_redirect off;
    port_in_redirect off;

    # /docs -> swagger UI
    location = /docs      { return 302 /docs.html; }
    location = /docs/     { return 302 /docs.html; }

    # /ideias -> galeria publica
    location = /ideias    { return 302 /ideias.html; }
    location = /ideias/   { return 302 /ideias.html; }

    # raiz -> redirect pra /ideias (galeria publica)
    location = / { return 302 /ideias.html; }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_index index.php;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_read_timeout 60s;
    }
  }
}
