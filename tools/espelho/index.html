<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Espelho do Patogochi</title>
<style>
  :root { --bg: #111; --fg: #ddd; --muted: #888; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  canvas { image-rendering: pixelated; width: min(960px, 100%); aspect-ratio: 4 / 3; display: block; }
  .barra { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { background: #333; color: var(--fg); border: 1px solid #555; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #444; }
  #status { color: var(--muted); }
  body.limpo .barra { display: none; }
</style>
</head>
<body>
<canvas id="tela" width="320" height="240"></canvas>
<div class="barra">
  <button id="conectar">Conectar no Core2</button>
  <button id="demo">Demo (sem aparelho)</button>
  <button id="fundo">Fundo: cena</button>
  <button id="limpo">Esconder botões (tecla H)</button>
  <span id="status">desconectado</span>
</div>
<script src="sprites.js"></script>
<script>
// Mesmas medidas do firmware/src/main.cpp
const W = 320, H = 240, DUCK_SCALE = 6, DUCK_X = 64, GROUND_Y = 190;
const DUCK_Y = GROUND_Y - 32 * DUCK_SCALE + 6;
const COCO_SCALE = 3, COCO_W = 13, COCO_H = 14;
const COCO_X = [12, W - 12 - COCO_W * COCO_SCALE, 60, W - 60 - COCO_W * COCO_SCALE];
const COR_FUNDO = '#9CD24A';
const FUNDOS = ['cena', 'verde'];

const tela = document.getElementById('tela');
const ctx = tela.getContext('2d');
ctx.imageSmoothingEnabled = false;
const statusEl = document.getElementById('status');

// carrega todos os PNGs
const imgs = {};
const carregando = [];
for (const [nome, n] of Object.entries(FRAME_COUNTS)) {
  imgs[nome] = [];
  for (let i = 1; i <= n; i++) {
    const img = new Image();
    img.src = `../../assets/sprites/${nome}/${String(i).padStart(2, '0')}.png`;
    carregando.push(img.decode().catch(() => console.warn('falhou', img.src)));
    imgs[nome].push(img);
  }
}

const comidas = {};
for (const nome of FOOD_NAMES) {
  const img = new Image();
  img.src = `../../assets/sprites/comidas/${nome}.png`;
  carregando.push(img.decode().catch(() => console.warn('falhou', img.src)));
  comidas[nome] = img;
}

const COMIDA_SCALE = 12;

// ícones da barra: lidos direto do firmware/include/icones.h ('k' = preto)
const BARRA_Y = 204, ICONE_ESCALA = 2, BOTAO_X = [53, 160, 267];
const icones = {};
carregando.push(fetch('../../firmware/include/icones.h').then(r => r.text()).then(txt => {
  for (const m of txt.matchAll(/ICONE_(\w+)\[ICONE_TAM\]\s*=\s*\{([^}]*)\}/g))
    icones[m[1]] = [...m[2].matchAll(/"([^"]*)"/g)].map(x => x[1]);
}).catch(() => console.warn('falhou icones.h')));

let corIcone = '#000';
const ESTRELAS = [[18,14,2,0],[52,40,1,1],[30,78,1,2],[14,120,2,1],[44,160,1,0],[290,18,2,2],[262,52,1,0],
                  [300,90,1,1],[276,130,2,0],[304,170,1,2],[120,10,1,1],[200,16,1,2],[160,6,2,0]];
function desenhaNoite() {
  const passo = Math.floor(performance.now() / 500);
  for (const [x, y, t, fase] of ESTRELAS) {
    const brilha = (passo + fase) % 3 !== 0;
    ctx.fillStyle = brilha ? '#ffff00' : '#8888a0';
    if (t === 2) {
      ctx.fillRect(x - 1, y - 4, 2, 8); ctx.fillRect(x - 4, y - 1, 8, 2);
      if (brilha) { ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 1, 2, 2); }
    } else ctx.fillRect(x - 1, y - 1, 2, 2);
  }
}

function desenhaIcone(icone, cx, cy, escala) {
  if (!icone) return;
  const n = icone.length, x0 = cx - n * escala / 2, y0 = cy - n * escala / 2;
  ctx.fillStyle = corIcone;
  icone.forEach((linha, j) => [...linha].forEach((c, i) => {
    if (c === 'k') ctx.fillRect(x0 + i * escala, y0 + j * escala, escala, escala);
  }));
}

let estado = { anim: 'parado', frame: 0, cocos: 0, frameCoco: 0, comida: null, revelando: false };
// UI tela gravando decimos arraste mortes hp batidas bateriaFraca cursor carga base
let ui = { tela: 0, gravando: false, decimos: 0, arraste: 0, mortes: 0, hp: -1, batidas: 0,
           bateriaFraca: false, cursor: 0, carga: 0, base: 'parado' };
let lista = [];          // [{id, feito, vencido, marcando, prazo, texto}]
let listaNova = null;    // sendo recebida
let listaFaltam = 0;
let ultimaBatida = 0, batidasAntes = 0;
let fundo = 0;

const TELA_PATO = 0, TELA_TAREFAS = 1, TELA_STATUS = 2;
const COR_TEXTO = '#202020', COR_REC = '#ff0000';
const MASSAGEM_BATIDAS = 30;
const fonte = (px) => `${px}px system-ui, sans-serif`;

function texto(t, x, y, cor, px, align = 'left') {
  ctx.fillStyle = cor; ctx.font = fonte(px); ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
}

// mesmas formas do firmware (desenhaSetaBaixo / desenhaCheck)
function setaBaixo(cx, cy) {
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.moveTo(cx, cy + 10); ctx.lineTo(cx - 8, cy + 2); ctx.lineTo(cx + 8, cy + 2); ctx.fill();
  ctx.fillRect(cx - 3, cy - 10, 6, 13);
}
function check(cx, cy, cor) {
  ctx.strokeStyle = cor; ctx.lineWidth = 5; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(cx - 11, cy); ctx.lineTo(cx - 4, cy + 7); ctx.lineTo(cx + 11, cy - 8); ctx.stroke();
}

// contorno = só a borda (coração vazio do status)
function desenhaIconeContorno(icone, cx, cy, escala) {
  if (!icone) return;
  const n = icone.length, x0 = cx - n * escala / 2, y0 = cy - n * escala / 2;
  const cheio = (i, j) => j >= 0 && j < n && i >= 0 && i < n && icone[j][i] === 'k';
  ctx.fillStyle = '#000';
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    if (!cheio(i, j)) continue;
    if (cheio(i - 1, j) && cheio(i + 1, j) && cheio(i, j - 1) && cheio(i, j + 1)) continue;
    ctx.fillRect(x0 + i * escala, y0 + j * escala, escala, escala);
  }
}

function desenhaBarra() {
  const cy = BARRA_Y + 18;
  if (ui.tela === TELA_PATO) {
    desenhaIcone(icones.TAREFAS, BOTAO_X[0], cy, ICONE_ESCALA);
    desenhaIcone(icones.CORACAO, BOTAO_X[1], cy, ICONE_ESCALA);
    desenhaIcone(icones.MICROFONE, BOTAO_X[2], cy, ICONE_ESCALA);
  } else {
    desenhaIcone(icones.VOLTAR, BOTAO_X[0], cy, ICONE_ESCALA);
  }
}

function desenhaGravando() {
  const cy = BARRA_Y + 18;
  let bx = Math.min(BOTAO_X[2] + ui.arraste / 2, W - 10);
  ctx.fillStyle = ctx.strokeStyle = COR_REC;
  if (Math.abs(ui.arraste) > 50) {
    ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(bx - 8, cy - 8); ctx.lineTo(bx + 8, cy + 8); ctx.moveTo(bx - 8, cy + 8); ctx.lineTo(bx + 8, cy - 8);
    ctx.stroke();
  } else if (Math.floor(performance.now() / 400) % 2) {
    ctx.beginPath(); ctx.arc(bx, cy, 8, 0, Math.PI * 2); ctx.fill();
  }
  texto((ui.decimos / 10).toFixed(1) + 's', BOTAO_X[1], cy, COR_TEXTO, 16, 'center');
}

function desenhaExtrasPato() {
  if (ui.base === 'morto' && estado.anim === 'morto' && !ui.gravando) {
    if (ui.batidas > 0) {
      const pulso = performance.now() - ultimaBatida < 150;
      desenhaIcone(icones.CORACAO, W / 2, 20, pulso ? 3 : 2);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(40.5, 42.5, W - 81, 9);
      ctx.fillStyle = COR_REC; ctx.fillRect(42, 44, (W - 84) * ui.batidas / MASSAGEM_BATIDAS, 6);
    } else {
      const pulo = Math.trunc(4 * Math.sin(performance.now() / 160));
      desenhaIcone(ui.desculpa ? icones.MICROFONE : icones.CORACAO, W / 2, 20 + pulo, 2);
      texto(ui.desculpa ? 'segure o microfone e implore!' : 'faça massagem cardíaca!', W / 2, 52, COR_TEXTO, 16, 'center');
    }
  }
  if (ui.bateriaFraca && Math.floor(performance.now() / 700) % 2) {
    const bx = W - 34, by = 6;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(bx + .5, by + .5, 23, 11);
    ctx.fillStyle = '#000'; ctx.fillRect(bx + 24, by + 3, 3, 6);
    ctx.fillStyle = COR_REC; ctx.fillRect(bx + 2, by + 2, 4, 8);
  }
}

// mesmo layout do firmware: checkbox | texto inteiro quebrado | data fixa à direita; ui.cursor = rolagem em px
function quebra(t, largura) {
  ctx.font = fonte(16);
  const linhas = []; let atual = '';
  for (const p of t.split(' ')) {
    const teste = atual ? atual + ' ' + p : p;
    if (ctx.measureText(teste).width > largura && atual) { linhas.push(atual); atual = p; } else atual = teste;
  }
  if (atual || !linhas.length) linhas.push(atual);
  return linhas.slice(0, 6);
}

function desenhaTarefas() {
  if (ui.carga === 1) return texto('carregando...', W / 2, 100, COR_TEXTO, 16, 'center');
  if (ui.carga === 3) return texto('erro', W / 2, 100, COR_TEXTO, 16, 'center');
  if (!lista.length) return texto('nenhuma tarefa \\o/', W / 2, 100, COR_TEXTO, 16, 'center');
  const LISTA_ALTURA = BARRA_Y - 4, X = 40, LINHA = 18;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, LISTA_ALTURA); ctx.clip();
  let y = 6 - ui.cursor;
  for (const l of lista) {
    const linhas = quebra(l.texto, W - X - 52 - 8);
    const h = Math.max(30, linhas.length * LINHA + 10);
    ctx.fillStyle = l.feito ? '#c0c0c0' : '#fff';
    ctx.beginPath(); ctx.roundRect(4, y, W - 8, h, 6); ctx.fill();
    const bx = 12, by = y + 5;
    ctx.strokeStyle = COR_TEXTO; ctx.lineWidth = 2; ctx.strokeRect(bx + 1, by + 1, 18, 18);
    if (l.feito) check(bx + 10, by + 9, '#00bc00');
    else if (l.marcando && Math.floor(performance.now() / 250) % 2) { ctx.fillStyle = '#aaa'; ctx.fillRect(bx + 5, by + 5, 10, 10); }
    linhas.forEach((t, k) => {
      const ly = y + 15 + k * LINHA;
      texto(t, X, ly, l.feito ? '#7b7b7b' : COR_TEXTO, 16);
      if (l.feito) { ctx.fillStyle = '#7b7b7b'; ctx.fillRect(X, ly, ctx.measureText(t).width, 1); }
    });
    const prazo = l.prazo === '-' ? '' : l.prazo;
    if (prazo) texto(prazo, W - 12, y + 15, l.vencido && !l.feito ? '#c80000' : COR_TEXTO, 16, 'right');
    y += h + 4;
  }
  ctx.restore();
}

function desenhaStatus() {
  const cheios = ui.hp < 0 ? 0 : Math.floor((ui.hp + 19) / 20);
  for (let i = 0; i < 5; i++) {
    if (i < cheios) desenhaIcone(icones.CORACAO, 48 + i * 56, 52, 3);
    else desenhaIconeContorno(icones.CORACAO, 48 + i * 56, 52, 3);
  }
  if (imgs.lapide) ctx.drawImage(imgs.lapide[0], (W - 96) / 2, 92, 96, 96);
  texto(String(ui.mortes), W / 2, 92 + 45, '#fff', 24, 'center');
}

function desenha() {
  ctx.clearRect(0, 0, W, H);
  const noite = ui.tela === TELA_PATO && estado.anim === 'dormindo' && !estado.revelando;
  if (FUNDOS[fundo] === 'cena') {
    ctx.fillStyle = noite ? '#3D2C6B' : COR_FUNDO; ctx.fillRect(0, 0, W, H);
    if (noite) desenhaNoite();
  } else if (FUNDOS[fundo] === 'verde') {
    ctx.fillStyle = '#00FF00'; ctx.fillRect(0, 0, W, H);
  }
  const ci = comidas[estado.comida];
  if (estado.revelando && ci) {
    const w = 16 * COMIDA_SCALE;
    ctx.drawImage(ci, (W - w) / 2, (H - w) / 2, w, w);
    return;
  }
  if (ui.tela === TELA_TAREFAS) desenhaTarefas();
  else if (ui.tela === TELA_STATUS) desenhaStatus();
  else {
    const frames = imgs[estado.anim];
    if (frames) ctx.drawImage(frames[estado.frame % frames.length], DUCK_X, DUCK_Y, 32 * DUCK_SCALE, 32 * DUCK_SCALE);
  }
  corIcone = noite && FUNDOS[fundo] === 'cena' ? '#fff' : '#000';
  if (!ui.gravando) desenhaBarra();
  corIcone = '#000';
  if (ui.tela === TELA_PATO) {
    desenhaExtrasPato();
    for (let i = 0; i < estado.cocos && i < COCO_X.length; i++) {
      const img = imgs.coco[(estado.frameCoco + i * 3) % imgs.coco.length];
      ctx.drawImage(img, COCO_X[i], GROUND_Y - COCO_H * COCO_SCALE + 4, COCO_W * COCO_SCALE, COCO_H * COCO_SCALE);
    }
  }
  if (ui.gravando) desenhaGravando();
}

// linhas do firmware (enviaEspelho em main.cpp):
//   PATO <anim> <frame> <cocos> <frameCoco> <comida> <revelando>
//   UI <tela> <gravando> <decimos> <arraste> <mortes> <hp> <batidas> <bateriaFraca> <cursor> <carga> <base> <exigeDesculpa>
//   LISTA <n>  seguido de n linhas  L <id> <feito> <vencido> <marcando> <prazo|-> <texto...>
function processaLinha(linha) {
  linha = linha.replace(/\r$/, '');
  const p = linha.split(' ');
  if (p[0] === 'PATO' && p.length >= 5) {
    estado = { anim: p[1], frame: +p[2], cocos: +p[3], frameCoco: +p[4], comida: p[5] || null, revelando: p[6] === '1' };
    statusEl.textContent = `conectado · ${estado.anim} frame ${estado.frame} · ${estado.cocos} cocô(s)`;
    desenha();
  } else if (p[0] === 'UI' && p.length >= 12) {
    const batidas = +p[7];
    if (batidas !== batidasAntes && batidas > 0) ultimaBatida = performance.now();
    batidasAntes = batidas;
    ui = { tela: +p[1], gravando: p[2] === '1', decimos: +p[3], arraste: +p[4], mortes: +p[5], hp: +p[6],
           batidas, bateriaFraca: p[8] === '1', cursor: +p[9], carga: +p[10], base: p[11],
           desculpa: p[12] === '1' };
    desenha();
  } else if (p[0] === 'LISTA') {
    listaFaltam = +p[1]; listaNova = [];
    if (!listaFaltam) { lista = []; listaNova = null; desenha(); }
  } else if (p[0] === 'L' && listaNova) {
    listaNova.push({ id: +p[1], feito: p[2] === '1', vencido: p[3] === '1', marcando: p[4] === '1',
                     prazo: p[5], texto: p.slice(6).join(' ') });
    if (--listaFaltam <= 0) { lista = listaNova; listaNova = null; desenha(); }
  }
}

let porta = null;
async function conectar() {
  if (!('serial' in navigator)) {
    statusEl.textContent = 'esse navegador não tem Web Serial: use Chrome ou Edge';
    return;
  }
  pararDemo();
  try {
    porta = await navigator.serial.requestPort();
    await porta.open({ baudRate: 115200 });
    // O Chrome liga DTR/RTS ao abrir a porta, e no Core2 esses fios seguram o ESP32 em reset.
    // Desliga os dois pra ele voltar a rodar.
    await porta.setSignals({ dataTerminalReady: false, requestToSend: false });
  } catch (e) {
    statusEl.textContent = 'não conectou: ' + e.message + ' (feche o pio monitor se estiver aberto)';
    return;
  }
  statusEl.textContent = 'conectado, esperando o pato…';
  const leitor = porta.readable.pipeThrough(new TextDecoderStream()).getReader();
  let buf = '';
  try {
    while (true) {
      const { value, done } = await leitor.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        processaLinha(buf.slice(0, i));
        buf = buf.slice(i + 1);
      }
    }
  } catch (e) {
    statusEl.textContent = 'desconectou: ' + e.message;
  }
}

// demo: passa por todos os estados sem aparelho, pra testar a página
let demoTimer = null;
function pararDemo() { clearInterval(demoTimer); demoTimer = null; }
function demo() {
  if (demoTimer) { pararDemo(); statusEl.textContent = 'demo parada'; return; }
  const anims = Object.keys(FRAME_COUNTS).filter(n => n !== 'coco');
  let a = 0, f = 0, voltas = 0, fc = 0, comidaDemo = 0;
  demoTimer = setInterval(() => {
    const n = FRAME_COUNTS[anims[a]];
    f++; fc = (fc + 1) % FRAME_COUNTS.coco;
    if (f >= n) { f = 0; if (++voltas >= Math.max(1, Math.ceil(12 / n))) { voltas = 0; a = (a + 1) % anims.length; } }
    if (f === 0 && anims[a] === 'comendo') comidaDemo = (comidaDemo + 1) % FOOD_NAMES.length;
    processaLinha(`PATO ${anims[a]} ${f} ${a % 5} ${fc} ${FOOD_NAMES[comidaDemo]}`);
    statusEl.textContent = 'demo · ' + statusEl.textContent.replace(/^conectado · /, '');
  }, 120);
}

document.getElementById('conectar').onclick = conectar;
document.getElementById('demo').onclick = demo;
document.getElementById('fundo').onclick = (ev) => {
  fundo = (fundo + 1) % FUNDOS.length;
  ev.target.textContent = 'Fundo: ' + FUNDOS[fundo];
  desenha();
};
document.getElementById('limpo').onclick = () => document.body.classList.add('limpo');
document.addEventListener('keydown', (e) => { if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('limpo'); });

Promise.all(carregando).then(desenha);
</script>
</body>
</html>
